<!DOCTYPE html>
<html lang="en">

<head>
	<meta charset="utf-8">
	<meta name="viewport" content="width=device-width, initial-scale=1">
	<meta name="color-scheme" content="dark light">
	<title>Discord Timestamps</title>
	<link href="discordtime.css" rel="stylesheet">
	<script src="https://unpkg.com/spacetime@7/builds/spacetime.min.js"></script>
	<script src="humantime.js" defer></script>
	<script src="discordtime.js" defer></script>
</head>

<body>
	<header class="site-header">
		<h1>Discord timestamps</h1>
		<p>Pick a time and copy a code. Discord shows it to everyone in their own timezone.</p>
	</header>

	<main class="layout">
		<section class="panel" aria-labelledby="time-heading">
			<h2 id="time-heading" class="panel-title">Time</h2>

			<div class="clock">
				<div class="clock-row">
					<span class="clock-label" id="timezoneName"></span>
					<span class="clock-value" id="timezoneTime"></span>
				</div>
				<div class="clock-row clock-row-muted">
					<span class="clock-label">Your time · <span id="localTimezone"></span></span>
					<span class="clock-value" id="localTime"></span>
				</div>
			</div>

			<div class="fields">
				<label class="field field-wide">
					<span>Human readable time</span>
					<input id="dtHuman" type="text" autocomplete="off" spellcheck="false" aria-describedby="dtHumanHint"
						placeholder="e.g. tomorrow 8pm, next friday at half past 7, in 2 hours">
					<span class="field-hint" id="dtHumanHint" aria-live="polite"></span>
				</label>
				<label class="field">
					<span>Date</span>
					<input id="dtDate" type="date">
				</label>
				<label class="field">
					<span>Time</span>
					<input id="dtTime" type="time">
				</label>
				<label class="field field-wide">
					<span>Timezone</span>
					<input id="dtTimezone" type="text" list="timezoneList" autocomplete="off" spellcheck="false">
					<datalist id="timezoneList"></datalist>
				</label>
				<label class="field field-wide">
					<span>Unix timestamp</span>
					<input id="dtUnix" type="text" inputmode="numeric" spellcheck="false">
				</label>
			</div>

			<div class="nudges" aria-label="Adjust time">
				<span class="nudge-label">Minutes</span>
				<button type="button" data-add="-15" data-unit="minutes">−15</button>
				<button type="button" data-add="-1" data-unit="minutes">−1</button>
				<button type="button" data-add="1" data-unit="minutes">+1</button>
				<button type="button" data-add="15" data-unit="minutes">+15</button>

				<span class="nudge-label">Hours</span>
				<button type="button" data-add="-5" data-unit="hours">−5</button>
				<button type="button" data-add="-1" data-unit="hours">−1</button>
				<button type="button" data-add="1" data-unit="hours">+1</button>
				<button type="button" data-add="5" data-unit="hours">+5</button>

				<span class="nudge-label">Days</span>
				<button type="button" data-add="-7" data-unit="days">−7</button>
				<button type="button" data-add="-1" data-unit="days">−1</button>
				<button type="button" data-add="1" data-unit="days">+1</button>
				<button type="button" data-add="7" data-unit="days">+7</button>
			</div>

			<button type="button" id="nowButton" class="text-button">Reset to now</button>
		</section>

		<section class="panel" aria-labelledby="output-heading">
			<h2 id="output-heading" class="panel-title">Paste into Discord</h2>
			<ul class="formats" id="formats"></ul>
			<p class="hint">Click a row to copy it. Previews use your browser's locale, which is what Discord uses.</p>
		</section>
	</main>
</body>

</html>
